language: "en-US"
tone_instructions: "Be concise and direct."
reviews:
  profile: "assertive"
  # CodeRabbit runs on demand only, not on every PR, to conserve review quota.
  # To request a review: add the `ai-review` label to the PR,
  # or comment `@coderabbitai review`.
  auto_review:
    enabled: false
    drafts: true
    base_branches:
      - main
      - master
  path_instructions:
    - path: "**"
      instructions: "Flag security issues: API keys, hardcoded credentials. Flag data loss risks."
    - path: "**/migrations/**"
      instructions: "D1 migrations must be additive — no DROP or destructive ALTER."
  path_filters:
    - "!**/*.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/venv/**"
    - "!**/.venv/**"
    - "!**/node_modules/**"
    - "!**/frameworks/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/__pycache__/**"
    - "!**/*.pyc"
  review_status: true
  poem: false
  collapse_walkthrough: false
  sequence_diagrams: false
  finishing_touches:
    docstrings:
      enabled: false
chat:
  auto_reply: true
knowledge_base:
  opt_out: true
