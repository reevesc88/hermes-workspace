# Hermes Workspace Workflow Update Coderabbit Bot Configuration

## Action

Follow the update-coderabbit-bot-configuration workflow:
1. Edit or create .github/coderabbit.yaml or .coderabbit.yaml to configure CodeRabbit bot settings.
2. Edit or create .github/workflows/coderabbit-trigger.yml to manage the workflow triggering CodeRabbit.
3. Optionally edit .github/workflows/copilot-review.yml if Copilot review integration is involved.
4. Commit changes with a message referencing CodeRabbit or Copilot review bots.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: .github/coderabbit.yaml, .coderabbit.yaml, .github/workflows/coderabbit-trigger.yml

